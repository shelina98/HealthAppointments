<h2 mat-dialog-title style="font-weight: bold;
  color: #3f51b5;">Book Appointment with Dr. {{ data.doctor.name }}</h2>

<mat-dialog-content [formGroup]="bookingForm">
  <p>Please describe your symptoms for the doctor's review.</p>
  
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Symptoms</mat-label>
    <textarea 
      matInput 
      formControlName="symptoms" 
      placeholder="Briefly describe why you are booking this appointment...">
    </textarea>
  @if (bookingForm.get('symptoms')?.invalid && bookingForm.get('symptoms')?.touched) {
      <mat-error>Please enter at least 5 characters.</mat-error>
    }
    
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions style="align-items:end">
  <button mat-button (click)="dialogRef.close()">Cancel</button>
  <button 
    mat-raised-button 
    color="primary" 
    [disabled]="bookingForm.invalid"
    (click)="submitRequest()">
    Send Request
  </button>
</mat-dialog-actions>
