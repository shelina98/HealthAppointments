<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title >Health Appointments</mat-card-title>
      <mat-card-subtitle>Login to your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="Ex. pat@example.com">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password">
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

          @if (loginForm.get('password')?.touched || !correctCredentials) {
     <mat-error class="post-click-error">E-mail or Password is not correct.</mat-error>
  }
        <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loginForm.invalid">
          LOGIN
        </button>

     <div>

</div>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <button mat-button class="full-width">Forgot Password?</button>
    </mat-card-footer>
  </mat-card>
</div>
